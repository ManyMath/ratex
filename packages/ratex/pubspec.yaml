name: ratex
description: >-
  KaTeX-compatible math rendering for Flutter. Builds the Rust RaTeX engine
  with cargokit, paints formulas with bundled KaTeX fonts, and runs on the
  web via WebAssembly.
version: 0.0.1
repository: https://github.com/ManyMath/ratex
issue_tracker: https://github.com/ManyMath/ratex/issues
topics:
  - latex
  - katex
  - math
  - rendering
  - ffi

environment:
  sdk: ^3.10.0
  flutter: '>=3.3.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ratex_dart: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true

  # The KaTeX fonts (SIL OFL 1.1 - see lib/fonts/LICENSE-KaTeX-fonts.txt).
  # Declared here so consuming apps get them bundled automatically; the
  # painter references them as 'packages/ratex/<family>', so apps do NOT need
  # to re-declare anything. Each file is its own family, named after the
  # display list's font ID: the KaTeX TTFs do not flag their italic faces as
  # italic, so selecting faces by FontStyle would apply a synthetic slant on
  # top of the real one.
  fonts:
    - family: KaTeX_AMS-Regular
      fonts:
        - asset: lib/fonts/KaTeX_AMS-Regular.ttf
    - family: KaTeX_Caligraphic-Bold
      fonts:
        - asset: lib/fonts/KaTeX_Caligraphic-Bold.ttf
    - family: KaTeX_Caligraphic-Regular
      fonts:
        - asset: lib/fonts/KaTeX_Caligraphic-Regular.ttf
    - family: KaTeX_Fraktur-Bold
      fonts:
        - asset: lib/fonts/KaTeX_Fraktur-Bold.ttf
    - family: KaTeX_Fraktur-Regular
      fonts:
        - asset: lib/fonts/KaTeX_Fraktur-Regular.ttf
    - family: KaTeX_Main-Bold
      fonts:
        - asset: lib/fonts/KaTeX_Main-Bold.ttf
    - family: KaTeX_Main-BoldItalic
      fonts:
        - asset: lib/fonts/KaTeX_Main-BoldItalic.ttf
    - family: KaTeX_Main-Italic
      fonts:
        - asset: lib/fonts/KaTeX_Main-Italic.ttf
    - family: KaTeX_Main-Regular
      fonts:
        - asset: lib/fonts/KaTeX_Main-Regular.ttf
    - family: KaTeX_Math-BoldItalic
      fonts:
        - asset: lib/fonts/KaTeX_Math-BoldItalic.ttf
    - family: KaTeX_Math-Italic
      fonts:
        - asset: lib/fonts/KaTeX_Math-Italic.ttf
    - family: KaTeX_SansSerif-Bold
      fonts:
        - asset: lib/fonts/KaTeX_SansSerif-Bold.ttf
    - family: KaTeX_SansSerif-Italic
      fonts:
        - asset: lib/fonts/KaTeX_SansSerif-Italic.ttf
    - family: KaTeX_SansSerif-Regular
      fonts:
        - asset: lib/fonts/KaTeX_SansSerif-Regular.ttf
    - family: KaTeX_Script-Regular
      fonts:
        - asset: lib/fonts/KaTeX_Script-Regular.ttf
    - family: KaTeX_Size1-Regular
      fonts:
        - asset: lib/fonts/KaTeX_Size1-Regular.ttf
    - family: KaTeX_Size2-Regular
      fonts:
        - asset: lib/fonts/KaTeX_Size2-Regular.ttf
    - family: KaTeX_Size3-Regular
      fonts:
        - asset: lib/fonts/KaTeX_Size3-Regular.ttf
    - family: KaTeX_Size4-Regular
      fonts:
        - asset: lib/fonts/KaTeX_Size4-Regular.ttf
    - family: KaTeX_Typewriter-Regular
      fonts:
        - asset: lib/fonts/KaTeX_Typewriter-Regular.ttf
