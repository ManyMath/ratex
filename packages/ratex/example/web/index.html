<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ratex web example</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 48rem;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    textarea {
      width: 100%;
      min-height: 5rem;
      font-family: ui-monospace, monospace;
      font-size: 1rem;
      box-sizing: border-box;
    }
    #controls { margin: 0.5rem 0 1rem; display: flex; gap: 1rem; align-items: center; }
    #output {
      border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
      border-radius: 0.5rem;
      padding: 1.5rem;
      min-height: 6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: auto;
      background: white; /* rendered SVG defaults to black ink */
      color: black;
    }
    #status { min-height: 1.5rem; font-size: 0.9rem; opacity: 0.8; }
    .error { color: #c0392b; }
  </style>
</head>
<body>
  <h1>ratex</h1>
  <p>
    LaTeX math rendered to self-contained SVG by the Rust
    <a href="https://github.com/erweixin/RaTeX">RaTeX</a> engine running as
    WebAssembly, no server, no webfonts, no JavaScript math library.
  </p>
  <textarea id="input" spellcheck="false">\frac{-b \pm \sqrt{b^2-4ac}}{2a}</textarea>
  <div id="controls">
    <button id="render">Render</button>
    <label><input type="checkbox" id="display-mode" checked> Display mode</label>
  </div>
  <div id="status"></div>
  <div id="output"></div>
  <script defer src="main.dart.js"></script>
</body>
</html>
