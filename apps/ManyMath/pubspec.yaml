name: manymath
description: >-
  A minimal LaTeX LaTeX editor: plaintext in, rendered document out.
  No accounts, no persistence - just the ratex rendering stack in a split-pane
  web app.
publish_to: 'none'

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ratex_flutter:
    path: ../../packages/ratex_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
