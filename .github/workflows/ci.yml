name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (ratex_ffi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/ratex-ffi
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/ratex-ffi
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown
      - run: rustup target add aarch64-linux-android
      - run: cargo check --target aarch64-linux-android
      - run: rustup target add x86_64-pc-windows-gnu
      - run: cargo check --target x86_64-pc-windows-gnu

  analyze-test:
    name: Analyze and test (Dart/Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/ratex-ffi
      - run: flutter pub get
      - name: Check formatting
        run: >-
          dart format --output none --set-exit-if-changed
          packages/ratex packages/ratex_flutter/lib packages/ratex_flutter/test
          packages/ratex_flutter/example/lib packages/ratex_flutter/example/test
          apps/ratex_example/lib apps/ratex_example/test
      - run: dart analyze packages/ratex
      - run: flutter analyze packages/ratex_flutter
      - run: flutter analyze apps/ratex_example
      - name: Build the native engine for tests
        run: cargo build --manifest-path native/ratex-ffi/Cargo.toml
      - run: dart test packages/ratex
      - run: flutter test packages/ratex_flutter/test
      - run: flutter test packages/ratex_flutter/example
      - run: flutter test apps/ratex_example/test
      - name: Compile the pure-Dart web example
        run: >-
          dart compile js packages/ratex/example/web/main.dart
          -o /tmp/ratex_web.js

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            app: packages/ratex_flutter/example
            flags: --debug
          - target: apk
            app: packages/ratex_flutter/example
            flags: --debug
          - target: web
            app: apps/ratex_example
            flags: --release --pwa-strategy=none
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/ratex-ffi
      - name: Install Linux desktop build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config
      - run: flutter pub get
      - name: Build the web engine
        if: matrix.target == 'web'
        run: ./tool/build_wasm.sh
      - name: Build ${{ matrix.target }}
        working-directory: ${{ matrix.app }}
        run: flutter build ${{ matrix.target }} ${{ matrix.flags }}
