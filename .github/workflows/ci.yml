name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale PR runs, but let every push to main finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust (ratex_ffi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ratex/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/ratex/rust
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The web build's configuration (see tool/build_wasm.sh).
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --no-default-features
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown --no-default-features
      - run: rustup target add aarch64-linux-android
      - run: cargo check --target aarch64-linux-android
      # cargokit builds Windows with the MSVC target.
      - run: rustup target add x86_64-pc-windows-msvc
      - run: cargo check --target x86_64-pc-windows-msvc

  wasm:
    name: Wasm (ratex_ffi.wasm, JS package)
    runs-on: ubuntu-latest
    env:
      BINARYEN_VERSION: '116'
      BINARYEN_SHA256: c55b74f3109cdae97490faf089b0286d3bba926bb6ea5ed00c8c784fc53718fd
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/ratex/rust
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install binaryen (wasm-opt)
        run: |
          release="binaryen-version_${BINARYEN_VERSION}"
          archive="$RUNNER_TEMP/${release}-x86_64-linux.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/${release}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  ${archive}" | sha256sum -c -
          tar -xz -C "$RUNNER_TEMP" -f "$archive"
          echo "$RUNNER_TEMP/${release}/bin" >> "$GITHUB_PATH"
      - name: Build the wasm engine
        run: ./tool/build_wasm.sh
        env:
          RATEX_REQUIRE_WASM_OPT: '1'
      # No imports or wasm-bindgen exports, and a size budget with some
      # headroom over the 2,675,024 bytes (1,066,408 gzipped) of Oct 2026.
      - name: Check imports, exports, and size
        run: >-
          node tool/check_wasm.mjs packages/ratex_wasm/ratex_ffi.wasm
          --max-bytes 2900000 --max-gzip-bytes 1150000
      - name: Test the JS package
        working-directory: packages/ratex_wasm
        run: npm test
        env:
          # Fail, rather than skip, if the module is missing.
          RATEX_REQUIRE_WASM: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: ratex_ffi.wasm
          path: packages/ratex_wasm/ratex_ffi.wasm
          if-no-files-found: error

  analyze-test:
    name: Analyze and test (Dart/Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/ratex/rust
      - run: flutter pub get
      - name: Check formatting
        run: >-
          dart format --output none --set-exit-if-changed
          packages/ratex_dart packages/ratex/lib packages/ratex/test
          packages/ratex/example/lib packages/ratex/example/test
          apps/ratex_example/lib apps/ratex_example/test
      - run: dart analyze packages/ratex_dart
      - run: flutter analyze packages/ratex
      - run: flutter analyze apps/ratex_example
      - name: Build the native engine for tests
        run: cargo build --manifest-path packages/ratex/rust/Cargo.toml
      - run: dart test packages/ratex_dart
        env:
          # Fail, rather than skip, the FFI tests if the library isn't found.
          RATEX_REQUIRE_NATIVE: '1'
      - run: flutter test packages/ratex/test
      - run: flutter test packages/ratex/example
      - run: flutter test apps/ratex_example/test
      - name: Compile the pure-Dart web example
        run: >-
          dart compile js packages/ratex_dart/example/web/main.dart
          -o /tmp/ratex_web.js

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            app: packages/ratex/example
            flags: --debug
          - target: apk
            app: packages/ratex/example
            flags: --debug
          - target: web
            app: apps/ratex_example
            flags: --release
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/ratex/rust
      - name: Install Linux desktop build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config
      - run: flutter pub get
      - name: Build the web engine
        if: matrix.target == 'web'
        run: ./tool/build_wasm.sh
      - name: Build ${{ matrix.target }}
        working-directory: ${{ matrix.app }}
        run: flutter build ${{ matrix.target }} ${{ matrix.flags }}
