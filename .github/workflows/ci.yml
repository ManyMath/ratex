name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (ratex_ffi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/ratex-ffi
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/ratex-ffi
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The crate must also compile for the web...
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown
      # ...for Android...
      - run: rustup target add aarch64-linux-android
      - run: cargo check --target aarch64-linux-android
      # ...and for Windows.
      - run: rustup target add x86_64-pc-windows-gnu
      - run: cargo check --target x86_64-pc-windows-gnu

  analyze-test:
    name: Analyze & test (Dart/Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # The pub workspace includes Flutter packages, so resolve with Flutter.
      - run: flutter pub get
      - name: Check formatting
        run: >-
          dart format --output none --set-exit-if-changed
          packages/ratex packages/ratex_flutter/lib packages/ratex_flutter/test
          packages/ratex_flutter/example/lib packages/ratex_flutter/example/test
          apps/ManyMath/lib apps/ManyMath/test
      - run: dart analyze packages/ratex
      - run: flutter analyze packages/ratex_flutter
      - run: flutter analyze apps/ManyMath
      # Build the native lib so the FFI end-to-end tests run (they self-skip
      # otherwise); the pure-Dart tests always run.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/ratex-ffi
      - run: cargo build --manifest-path native/ratex-ffi/Cargo.toml
      - run: dart test packages/ratex
      # Scope to the plugin's own tests (not the vendored cargokit tests).
      - run: flutter test packages/ratex_flutter/test
      - run: flutter test apps/ManyMath/test
      - name: Example tests
        working-directory: packages/ratex_flutter/example
        run: flutter test
      # Verify the pure-Dart web example compiles to JavaScript (the wasm
      # backend, no dart:ffi).
      - run: >-
          dart compile js packages/ratex/example/web/main.dart
          -o /tmp/ratex_web.js

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # flags is explicit per entry: GHA's `&& '' ||` ternary idiom
        # collapses empty strings to the || branch.
        include:
          - target: linux
            app: packages/ratex_flutter/example
            flags: --debug
          - target: apk
            app: packages/ratex_flutter/example
            flags: --debug
          - target: web
            app: apps/ManyMath
            flags: --release
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/ratex-ffi
      - name: Install Linux desktop build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config
      - name: Build the wasm engine
        if: matrix.target == 'web'
        run: |
          rustup target add wasm32-unknown-unknown
          bash tool/build_wasm.sh
      - run: flutter pub get
      - name: Build ${{ matrix.target }}
        working-directory: ${{ matrix.app }}
        run: flutter build ${{ matrix.target }} ${{ matrix.flags }}
