name: Precompile binaries

# Builds signed prebuilt ratex_ffi libraries and uploads them to a
# `precompiled_<crate-hash>` GitHub release, so consumers can build
# ratex_flutter without a Rust toolchain. cargokit verifies each download
# against the public_key in native/ratex-ffi/cargokit.yaml.
#
# Requires one repository secret:
#   CARGOKIT_PRIVATE_KEY: the hex private key from `build_tool gen-key`.
# GITHUB_TOKEN is provided automatically; `contents: write` below lets it
# create the release and upload assets.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  REPO: ManyMath/ratex
  BUILD_TOOL: packages/ratex_flutter/cargokit/build_tool

jobs:
  linux:
    name: Precompile (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: dtolnay/rust-toolchain@stable
      - run: dart pub get
        working-directory: ${{ env.BUILD_TOOL }}
      - name: Precompile
        env:
          PRIVATE_KEY: ${{ secrets.CARGOKIT_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dart run "$BUILD_TOOL/bin/build_tool.dart" precompile-binaries -v \
            --manifest-dir="$GITHUB_WORKSPACE/native/ratex-ffi" \
            --repository="$REPO" \
            --target x86_64-unknown-linux-gnu

  android:
    name: Precompile (Android ABIs)
    # Both jobs get or create the same precompiled_<hash> release without
    # retrying, so running them concurrently can race to create it.
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          # cargokit looks for the NDK at <sdk>/ndk/<full version>.
          link-to-sdk: true
      - run: dart pub get
        working-directory: ${{ env.BUILD_TOOL }}
      - name: Precompile
        env:
          PRIVATE_KEY: ${{ secrets.CARGOKIT_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dart run "$BUILD_TOOL/bin/build_tool.dart" precompile-binaries -v \
            --manifest-dir="$GITHUB_WORKSPACE/native/ratex-ffi" \
            --repository="$REPO" \
            --android-sdk-location="$ANDROID_HOME" \
            --android-ndk-version="${{ steps.ndk.outputs.ndk-full-version }}" \
            --android-min-sdk-version=21 \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target x86_64-linux-android \
            --target i686-linux-android
