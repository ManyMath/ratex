[package]
name = "ratex_ffi"
version = "0.0.1"
edition = "2021"
description = "Portable C ABI around the RaTeX math typesetting engine (native + wasm32)."
license = "MIT"
repository = "https://github.com/ManyMath/ratex"

[lib]
name = "ratex_ffi"
# cdylib for FFI from Dart and for wasm32-unknown-unknown (loaded over JS
# interop on the web); staticlib for static linking (e.g. iOS); rlib so
# in-repo examples/tests can call the API directly.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# The erweixin/RaTeX KaTeX-compatible math engine. The parse -> layout ->
# DisplayList pipeline is pure Rust with no system dependencies (no fs, no
# threads), so it cross-compiles to every native target and to
# wasm32-unknown-unknown unchanged.
ratex-parser = "0.1.13"
ratex-layout = "0.1.13"
ratex-types = "0.1.13"
# SVG export. `embed-fonts` compiles the KaTeX TTFs into the binary so
# `embed_glyphs` SVG output is fully self-contained (no font files, no CSS).
ratex-svg = { version = "0.1.13", features = ["embed-fonts"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
# Keep the wasm (and native) artifacts small; the embedded KaTeX fonts
# dominate size, so trade compile time for dead-code elimination.
lto = true
codegen-units = 1
