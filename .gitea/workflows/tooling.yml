name: Private included-tooling verification
on:
  push:
    branches: [main, 'maintenance/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  DASH__SUPPRESS_ANALYTICS: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  CI: 'true'
  DO_NOT_TRACK: '1'
jobs:
  tooling:
    runs-on: manymath-maintenance-linux-x64
    timeout-minutes: 30
    steps:
      - name: Require private primary forge
        env:
          PRIMARY_SERVER: ${{ github.server_url }}
        run: test "$PRIMARY_SERVER" = 'https://git.manymath.com'
      - uses: actions/checkout@v4
      - name: Record provisioned tools
        run: |
          python3 --version
          git --version
          dart --version
          flutter --version
      - name: Sync safety regressions
        run: python3 -m unittest discover -s tool/tests -v
      - name: Rebuild exact tooling identity from private fork
        env:
          GIT_SSH_COMMAND: /usr/bin/ssh -o Hostname=195.201.108.115 -p 2222 -l git -o ProxyCommand=none -o ProxyJump=none
          GIT_SSH_VARIANT: ssh
        run: |
          source_root="$(mktemp -d)"
          trap 'rm -rf "$source_root"' EXIT
          git -c core.hooksPath=/dev/null clone --quiet --no-checkout ssh://git@git.manymath.com:2222/sneurlax/cargokit.git "$source_root/fork"
          python3 tool/cargokit_sync.py --manifest tool/cargokit/manifest.json --source "$source_root/fork" --check packages/ratex/cargokit
      - name: Actual archive tooling and license verification
        run: |
          evidence_root="$(mktemp -d)"
          python3 tool/check_tooling_archive.py --output "$evidence_root/tooling"
          cat "$evidence_root/tooling/evidence.json"
          echo "Private tooling-only archive evidence retained at $evidence_root/tooling"
