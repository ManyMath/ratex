name: ratex_workspace
publish_to: none

# Dart pub workspace root. Member packages set `resolution: workspace` and
# share a single lockfile. Melos drives multi-package tooling on top of this.
environment:
  sdk: ^3.10.0

workspace:
  - packages/ratex_dart
  - packages/ratex
  - packages/ratex/example
  - apps/ratex_example

dev_dependencies:
  melos: ^7.0.0

# Melos 7 reads its configuration from here (the pub-workspace root). Scripts
# mirror CI and use the right tool per package (dart vs flutter).
melos:
  name: ratex
  scripts:
    analyze:
      description: Analyze all packages.
      run: >-
        dart analyze packages/ratex_dart &&
        flutter analyze packages/ratex &&
        flutter analyze apps/ratex_example
    format:
      description: Check Dart formatting.
      run: >-
        dart format --output none --set-exit-if-changed
        packages/ratex_dart packages/ratex/lib packages/ratex/test
        packages/ratex/example/lib packages/ratex/example/test
        apps/ratex_example/lib
        apps/ratex_example/test
    format:fix:
      description: Apply Dart formatting.
      run: >-
        dart format
        packages/ratex_dart packages/ratex/lib packages/ratex/test
        packages/ratex/example/lib packages/ratex/example/test
        apps/ratex_example/lib
        apps/ratex_example/test
    test:
      description: Run Dart and Flutter tests.
      run: >-
        dart test packages/ratex_dart &&
        flutter test packages/ratex/test &&
        flutter test packages/ratex/example &&
        flutter test apps/ratex_example/test
    native:build:
      description: Build the ratex_ffi shared library (for CLI/dev use).
      # cd into the crate so its rust-toolchain.toml is honored.
      run: cd packages/ratex/rust && cargo build --release
    native:test:
      description: Run the Rust crate tests.
      run: cd packages/ratex/rust && cargo test
    native:build:web:
      description: >-
        Build ratex_ffi for wasm32-unknown-unknown and copy the .wasm where the
        web examples expect it (pure-Dart, plugin, and application examples).
      run: bash tool/build_wasm.sh
